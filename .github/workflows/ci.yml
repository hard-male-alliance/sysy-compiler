name: Cross-platform C++23

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5
      # 中文：显式安装开发头文件，避免依赖 runner 镜像的偶然预装内容。
      # English: Install development headers explicitly rather than relying on runner images.
      - name: Install SQLite and Ninja (Linux)
        if: runner.os == 'Linux'
        # 中文：安装 GNU/Linux RISC-V 工具链，以构建匹配 glibc 的运行时归档并执行端到端测试。
        # English: Install GNU/Linux RISC-V tools for a glibc-matched runtime archive and E2E execution.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ninja-build gcc-riscv64-linux-gnu qemu-user
      - name: Install SQLite and Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite ninja
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake --preset "${{ matrix.preset }}" -DCMAKE_PREFIX_PATH="$(brew --prefix sqlite)"
          else
            cmake --preset "${{ matrix.preset }}" -DSYSY_BUILD_RISCV_RUNTIME=ON
          fi
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows MinGW / ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5
      # 中文：MSYS2 同时提供一致的 GCC、Ninja、SQLite 及 Python 工具链。
      # English: MSYS2 supplies a coherent GCC, Ninja, SQLite, and Python toolchain.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-python
      - name: Configure
        shell: msys2 {0}
        run: cmake --preset '${{ matrix.preset }}'
      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset '${{ matrix.preset }}' --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --preset '${{ matrix.preset }}'

  sanitizer:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # 中文：与 Linux E2E 相同的目标工具链，另对宿主编译器启用内存及未定义行为检测。
      # English: Keep the Linux E2E toolchain, adding host memory and undefined-behavior checks.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ninja-build gcc-riscv64-linux-gnu qemu-user
      - name: Configure
        run: cmake --preset sanitizer -DSYSY_BUILD_RISCV_RUNTIME=ON
      - name: Build
        run: cmake --build --preset sanitizer --parallel
      - name: Test
        run: ctest --preset sanitizer
